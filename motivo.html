<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="Conoce el motivo y propósito de esta rifa.">

    <title>Motivo · <span data-theme="rifa">Cargando…</span></title>

    <link rel="manifest" href="pwa/manifest.json">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A1%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/plantillas.css">
</head>
<body data-page="motivo">

    <header class="fixed-header">
        <div class="header-brand">
            <div class="header-logo" data-theme="logo">💡</div>
            <div class="header-title">Motivo de la Rifa</div>
        </div>
        <span class="header-badge info">Propósito</span>
    </header>

    <div class="progress-bar-container">
        <div class="progress-bar-fill" style="width: 40%;"></div>
    </div>

    <main class="main-container">

        <div class="terms-box" id="motivo-box" aria-live="polite">
            <p class="empty-msg">Cargando motivo…</p>
        </div>

        <section class="motivo-cta">
            <h3>¿Listo para participar?</h3>
            <p>Cada granito de arena cuenta. Elige tus números.</p>
            <a href="rifas.html" class="btn-accion" style="text-decoration: none;">
                🎟️ Quiero jugar un número
            </a>
            <a href="premios.html" class="btn-accion btn-ghost" style="text-decoration: none;">
                🏆 Ver los premios
            </a>
        </section>

    </main>

    <!-- ============================================================
         NAV INFERIOR · JUGAR DESTACADO
         ============================================================ -->
    <nav class="fixed-bottom" aria-label="Navegación principal">

        <a href="index.html" class="nav-item">
            <span>🏠</span>
            <span>Inicio</span>
        </a>

        <a href="premios.html" class="nav-item">
            <span>🏆</span>
            <span>Premios</span>
        </a>

        <a href="rifas.html" class="nav-item destacado">
            <span class="nav-icono-destacado">🎟️</span>
            <span class="nav-texto-destacado">Jugar</span>
        </a>

        <a href="boleto.html" class="nav-item">
            <span>🔎</span>
            <span>Boleto</span>
        </a>

    </nav>

    <script src="assets/js/ui.js"></script>
    <script src="assets/js/storage.js"></script>
    <script src="assets/js/md.js"></script>
    <script src="assets/js/theme.js"></script>

    <script>
    (function () {
        'use strict';
        var U     = window.UI;
        var Store = window.Store;
        var MD    = window.MD;
        var Theme = window.Theme;

        var el = {};

        function init() {
            el.motivoBox = U.$('#motivo-box');

            try {
                document.title = 'Motivo · ' + Theme.nombreRifa();
            } catch (e) { /* silent */ }

            if (U.getParam('embed') === '1') activarModoEmbed();

            MD.cargarEnDOM('content/motivo.md', el.motivoBox, 'motivo')
                .then(function (ok) {
                    if (!ok) U.toast('No se pudo cargar el motivo.', 'danger');
                })
                .catch(function (err) {
                    U.warn('Error cargando motivo:', err);
                });
        }

        function activarModoEmbed() {
            document.body.classList.add('embed-mode');
            if (U.$('.embed-close-btn')) return;
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'embed-close-btn';
            btn.textContent = '← Volver al Panel';
            btn.addEventListener('click', function () {
                if (window.parent && window.parent !== window) {
                    try {
                        window.parent.postMessage({ tipo: 'cerrar-embed' }, '*');
                        return;
                    } catch (e) { /* fallback */ }
                }
                location.href = 'admin.html';
            });
            document.body.appendChild(btn);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>

</body>
</html>
